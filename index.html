<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ops Knowledge Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer onload="window.__gsiLoaded=true; if(window.__onGsiReady) window.__onGsiReady();"></script>
<style>
  :root{
    --navy:#12233F;
    --navy-2:#1F4E78;
    --amber:#D98E2B;
    --amber-soft:#F6E4C2;
    --green:#1E8A5B;
    --green-soft:#E4F5EC;
    --red:#C0392B;
    --red-soft:#FBE6E3;
    --bg:#F2F3F6;
    --card:#FFFFFF;
    --line:#E3E6EC;
    --ink:#151B2B;
    --ink-mute:#5B6579;
    --radius:14px;
    --shadow:0 1px 2px rgba(18,35,63,0.06), 0 8px 24px rgba(18,35,63,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.display{font-family:'Sora',system-ui,sans-serif; letter-spacing:-0.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .app{max-width:900px;margin:0 auto;padding:28px 20px 80px;}
  .app.wide{max-width:1080px;}

  /* ---- top bar ---- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px;background:var(--navy);color:#fff;
    position:sticky;top:0;z-index:50;
  }
  .topbar .brand{display:flex;align-items:center;gap:10px;font-family:'Sora';font-weight:700;font-size:15px;}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--amber);}
  .topbar .meta{font-size:13px;color:#B9C4D6;}
  .topbar .actions{display:flex;gap:10px;align-items:center;}
  .link-btn{background:none;border:none;color:#CBD6E8;font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-family:'Inter';}
  .link-btn:hover{color:#fff;}

  /* ---- generic card ---- */
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);}
  .pad{padding:28px;}

  /* ---- landing ---- */
  .landing-wrap{display:flex;min-height:calc(100vh - 60px);align-items:center;justify-content:center;padding:40px 20px;}
  .landing-card{max-width:480px;width:100%;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);font-weight:600;}
  .landing-card h1{font-size:28px;margin:10px 0 6px;line-height:1.2;}
  .landing-card p.sub{color:var(--ink-mute);font-size:14.5px;line-height:1.6;margin:0 0 24px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--ink);}
  .field input{
    width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;
    font-size:15px;font-family:'Inter';background:#FBFBFD;
  }
  .field input:focus{outline:none;border-color:var(--navy-2);background:#fff;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:13px 22px;border-radius:10px;font-weight:600;font-size:14.5px;
    border:none;cursor:pointer;font-family:'Inter';transition:transform .08s ease, box-shadow .15s ease;
  }
  .btn-primary{background:var(--navy-2);color:#fff;width:100%;margin-top:18px;}
  .btn-primary:hover{background:#173D5E;}
  .btn-primary:disabled{background:#B9C2CE;cursor:not-allowed;}
  .btn-primary:active{transform:scale(.99);}
  .btn-ghost{background:transparent;color:var(--navy-2);border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--navy-2);}
  .stat-row{display:flex;gap:18px;margin-top:22px;padding-top:20px;border-top:1px solid var(--line);}
  .stat-row .s{flex:1;}
  .stat-row .s .n{font-family:'Sora';font-weight:700;font-size:20px;color:var(--navy);}
  .stat-row .s .l{font-size:11.5px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}

  /* ---- test screen ---- */
  .progress-shell{
    position:sticky;top:57px;z-index:40;background:var(--bg);
    padding:14px 0 10px;
  }
  .progress-shell .inner{
    display:flex;align-items:center;gap:14px;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:12px 16px;box-shadow:var(--shadow);
  }
  .progress-bar{flex:1;height:8px;background:#E9EBF0;border-radius:6px;overflow:hidden;}
  .progress-bar .fill{height:100%;background:linear-gradient(90deg,var(--navy-2),var(--amber));border-radius:6px;transition:width .25s ease;}
  .progress-count{font-family:'IBM Plex Mono';font-size:13px;color:var(--ink-mute);white-space:nowrap;}

  .section-heading{
    margin:34px 0 14px;display:flex;align-items:baseline;gap:10px;
  }
  .section-heading .idx{font-family:'IBM Plex Mono';font-size:12px;color:var(--amber);font-weight:600;}
  .section-heading h2{font-size:17px;margin:0;color:var(--navy);}

  .qcard{padding:22px 24px;margin-bottom:14px;}
  .qcard .qtop{display:flex;gap:10px;align-items:flex-start;margin-bottom:4px;}
  .qnum{font-family:'IBM Plex Mono';font-weight:600;color:var(--navy-2);font-size:14px;min-width:34px;}
  .qtext{font-size:15px;line-height:1.55;font-weight:500;}
  .qmodule{font-size:11.5px;color:var(--ink-mute);margin:6px 0 16px 44px;font-style:italic;}
  .options{display:flex;flex-direction:column;gap:8px;margin-left:44px;}
  .opt{
    display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border:1.5px solid var(--line);
    border-radius:9px;cursor:pointer;font-size:14px;line-height:1.5;transition:border-color .12s, background .12s;
  }
  .opt:hover{border-color:#AEB8CC;background:#FAFBFC;}
  .opt.selected{border-color:var(--navy-2);background:#EEF3F8;}
  .opt .letter{
    width:22px;height:22px;border-radius:50%;border:1.5px solid #C6CCD6;display:flex;align-items:center;
    justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;color:var(--ink-mute);font-family:'IBM Plex Mono';
  }
  .opt.selected .letter{background:var(--navy-2);border-color:var(--navy-2);color:#fff;}

  .submit-bar{
    position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);
    padding:16px 20px;display:flex;align-items:center;justify-content:space-between;
    margin:30px -20px -80px;box-shadow:0 -6px 18px rgba(0,0,0,0.04);
  }
  .submit-bar .note{font-size:13px;color:var(--ink-mute);}
  .submit-bar .btn{width:auto;margin:0;}

  /* ---- report screen ---- */
  .score-hero{display:flex;gap:32px;align-items:center;padding:32px;flex-wrap:wrap;}
  .gauge{position:relative;width:150px;height:150px;flex-shrink:0;}
  .gauge svg{transform:rotate(-90deg);}
  .gauge .center{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .gauge .pct{font-family:'Sora';font-weight:800;font-size:30px;}
  .gauge .of{font-size:11px;color:var(--ink-mute);margin-top:-2px;}
  .score-side h2{margin:0 0 6px;font-size:22px;}
  .badge{
    display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;
    text-transform:uppercase;letter-spacing:.04em;
  }
  .badge.pass{background:var(--green-soft);color:var(--green);}
  .badge.fail{background:var(--red-soft);color:var(--red);}
  .score-side p{color:var(--ink-mute);font-size:14px;margin:10px 0 0;max-width:420px;}

  .breakdown{padding:26px 28px;}
  .breakdown h3{margin:0 0 16px;font-size:15px;}
  .bd-row{display:flex;align-items:center;gap:14px;margin-bottom:12px;}
  .bd-row .label{width:230px;font-size:13px;color:var(--ink);flex-shrink:0;}
  .bd-track{flex:1;height:10px;background:#EEF0F3;border-radius:6px;overflow:hidden;}
  .bd-fill{height:100%;border-radius:6px;}
  .bd-score{font-family:'IBM Plex Mono';font-size:12.5px;color:var(--ink-mute);width:46px;text-align:right;}

  .review-item{padding:20px 24px;margin-bottom:12px;border-left:4px solid var(--line);}
  .review-item.correct{border-left-color:var(--green);}
  .review-item.incorrect{border-left-color:var(--red);}
  .review-item .rtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
  .review-item .rq{font-size:14.5px;font-weight:500;line-height:1.5;}
  .review-item .rmod{font-size:11px;color:var(--ink-mute);margin:4px 0 12px;font-style:italic;}
  .r-status{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;flex-shrink:0;padding:3px 9px;border-radius:12px;}
  .r-status.correct{background:var(--green-soft);color:var(--green);}
  .r-status.incorrect{background:var(--red-soft);color:var(--red);}
  .ropt{font-size:13.5px;padding:8px 12px;border-radius:7px;margin-bottom:5px;display:flex;gap:8px;}
  .ropt .l{font-family:'IBM Plex Mono';font-weight:700;font-size:12px;}
  .ropt.your-wrong{background:var(--red-soft);color:#7A2E22;}
  .ropt.correct-answer{background:var(--green-soft);color:#155C3D;}

  .section-title-row{display:flex;align-items:center;justify-content:space-between;margin:30px 0 6px;}
  .section-title-row h3{margin:0;font-size:16px;color:var(--navy);}
  .filter-chip{font-size:12px;background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:20px;cursor:pointer;color:var(--ink-mute);}
  .filter-chip.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .filter-row{display:flex;gap:8px;margin:14px 0 6px;flex-wrap:wrap;}

  /* ---- admin ---- */
  .gate-wrap{display:flex;min-height:calc(100vh - 60px);align-items:center;justify-content:center;}
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px;}
  .kpi{padding:20px;}
  .kpi .n{font-family:'Sora';font-weight:800;font-size:26px;color:var(--navy);}
  .kpi .l{font-size:12px;color:var(--ink-mute);margin-top:4px;}
  table.admin-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.admin-table th{
    text-align:left;padding:10px 14px;background:#F7F8FA;color:var(--ink-mute);
    font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;
    border-bottom:1.5px solid var(--line);
  }
  table.admin-table td{padding:12px 14px;border-bottom:1px solid var(--line);}
  table.admin-table tr.clickable{cursor:pointer;}
  table.admin-table tr.clickable:hover{background:#FAFBFD;}
  .score-pill{font-family:'IBM Plex Mono';font-weight:600;padding:2px 8px;border-radius:6px;font-size:12.5px;}
  .score-pill.pass{background:var(--green-soft);color:var(--green);}
  .score-pill.fail{background:var(--red-soft);color:var(--red);}
  .empty-state{padding:60px 20px;text-align:center;color:var(--ink-mute);}
  .empty-state .big{font-size:34px;margin-bottom:10px;}
  .weak-list{display:flex;flex-direction:column;gap:10px;}
  .weak-list .wrow{display:flex;justify-content:space-between;font-size:13.5px;padding:10px 0;border-bottom:1px solid var(--line);}
  .weak-list .wrow:last-child{border-bottom:none;}
  .back-link{font-size:13px;color:var(--navy-2);cursor:pointer;display:inline-flex;align-items:center;gap:6px;margin-bottom:16px;font-weight:600;}

  /* ---- single-question test view ---- */
  .qcounter{font-family:'IBM Plex Mono';font-size:13px;color:var(--navy);white-space:nowrap;}
  .qcounter b{color:var(--navy-2);}
  .navigator{
    display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 18px;padding:14px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
  }
  .nav-dot{
    width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono';font-size:12px;font-weight:600;color:var(--ink-mute);
    border:1.5px solid var(--line);cursor:pointer;background:#FBFBFD;flex-shrink:0;
    transition:transform .1s ease;
  }
  .nav-dot:hover{transform:scale(1.08);border-color:#AEB8CC;}
  .nav-dot.answered{background:var(--green-soft);color:var(--green);border-color:var(--green);}
  .nav-dot.current{background:var(--navy);color:#fff;border-color:var(--navy);}
  .section-tag{
    font-family:'IBM Plex Mono';font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--amber);font-weight:600;margin:0 0 8px 2px;
  }
  .qcard-single{padding:28px 30px;margin-bottom:20px;}
  .qcard-single .qtop{display:flex;gap:12px;align-items:flex-start;margin-bottom:6px;}
  .qcard-single .qnum{font-family:'IBM Plex Mono';font-weight:700;color:var(--navy-2);font-size:15px;min-width:38px;}
  .qcard-single .qtext{font-size:17px;line-height:1.6;font-weight:500;}
  .qcard-single .qmodule{font-size:12px;color:var(--ink-mute);margin:8px 0 22px 50px;font-style:italic;}
  .qcard-single .options{margin-left:50px;gap:10px;}

  .subjective-wrap{margin-left:50px;}
  .subjective-marks-tag{
    font-family:'IBM Plex Mono';font-size:11.5px;color:var(--amber);font-weight:600;
    text-transform:uppercase;letter-spacing:.03em;margin-bottom:10px;
  }
  .subj-textarea{
    width:100%;min-height:160px;padding:14px 16px;border:1.5px solid var(--line);border-radius:9px;
    font-family:'Inter';font-size:14.5px;line-height:1.6;resize:vertical;background:#FBFBFD;
  }
  .subj-textarea:focus{outline:none;border-color:var(--navy-2);background:#fff;}
  .qcard-single .opt{padding:14px 16px;font-size:14.5px;}
  .nav-bar{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    margin:8px 0 40px;flex-wrap:wrap;
  }
  .nav-bar .note{font-size:12.5px;color:var(--ink-mute);flex:1;text-align:center;min-width:180px;}
  .nav-bar .btn-ghost{width:auto;}

  /* ---- test selection screen ---- */
  .test-card{padding:24px 26px;margin-bottom:14px;}
  .test-card .ttop{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;}
  .test-card h3{margin:0 0 6px;font-size:17px;}
  .test-card p{margin:0;font-size:13.5px;color:var(--ink-mute);line-height:1.55;max-width:520px;}
  .status-pill{
    font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
    padding:4px 11px;border-radius:20px;white-space:nowrap;flex-shrink:0;
  }
  .status-pill.not-started{background:#EEF0F3;color:var(--ink-mute);}
  .status-pill.in-progress{background:var(--amber-soft);color:var(--amber);}
  .status-pill.completed{background:var(--green-soft);color:var(--green);}
  .test-card .tactions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
  .test-card .tactions .btn{width:auto;margin:0;padding:9px 16px;font-size:13.5px;}
  .user-chip{
    display:flex;align-items:center;gap:8px;font-size:12.5px;color:#B9C4D6;
  }
  .user-chip .logout{cursor:pointer;text-decoration:underline;text-underline-offset:2px;color:#CBD6E8;}
  .user-chip .logout:hover{color:#fff;}

  .test-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .test-tab{
    font-size:13px;font-weight:600;padding:8px 16px;border-radius:9px;cursor:pointer;
    background:var(--card);border:1.5px solid var(--line);color:var(--ink-mute);
  }
  .test-tab.active{background:var(--navy);color:#fff;border-color:var(--navy);}

  @media (max-width:640px){
    .score-hero{flex-direction:column;text-align:center;}
    .qmodule,.options{margin-left:0;}
    .kpi-grid{grid-template-columns:repeat(2,1fr);}
    .bd-row .label{width:140px;font-size:12px;}
    .qcard-single{padding:20px;}
    .qcard-single .qmodule,.qcard-single .options{margin-left:0;}
    .subjective-wrap{margin-left:0;}
    .nav-bar{flex-direction:column;}
    .nav-bar .note{order:3;}
    .nav-dot{width:26px;height:26px;font-size:11px;}
    .test-card .ttop{flex-direction:column;}
  }
  .search-field{margin-bottom:20px;}
  .search-field input{
    width:100%;padding:12px 16px;border:1.5px solid var(--line);border-radius:10px;
    font-size:14px;font-family:'Inter';background:#fff;
  }
  .search-field input:focus{outline:none;border-color:var(--navy-2);}
  .admin-select-wrap{margin-bottom:0;}
  .admin-select-wrap select{
    padding:10px 14px;border:1.5px solid var(--line);border-radius:9px;font-size:14px;
    font-family:'Inter';font-weight:600;background:#fff;color:var(--navy);min-width:260px;
  }
  .loading-inline{display:flex;align-items:center;gap:10px;color:var(--ink-mute);font-size:13.5px;padding:16px 0;}
  .spinner{
    width:16px;height:16px;border:2px solid #DDE1E8;border-top-color:var(--navy-2);
    border-radius:50%;animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .gsi-btn-wrap{display:flex;justify-content:center;margin-top:8px;min-height:44px;}
  .gsi-fallback-note{font-size:12.5px;color:var(--ink-mute);text-align:center;margin-top:10px;}

  .timer-box{
    font-family:'IBM Plex Mono';font-size:14px;font-weight:600;color:var(--navy);
    padding:6px 12px;border-radius:8px;background:#EEF3F8;white-space:nowrap;
  }
  .timer-box.warn{background:var(--red-soft);color:var(--red);}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(18,35,63,0.55);z-index:100;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .modal-card{max-width:420px;width:100%;}

  .member-filter-wrap{position:relative;display:inline-block;}
  .admin-controls-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
  .member-filter-panel{
    position:absolute;top:calc(100% + 6px);left:0;z-index:60;width:300px;
    padding:14px;box-shadow:0 8px 28px rgba(18,35,63,0.18);
  }
  .mf-header{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.03em;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line);}
  .mf-search{width:100%;padding:8px 11px;border:1.5px solid var(--line);border-radius:7px;font-size:13px;font-family:'Inter';margin-bottom:8px;}
  .mf-search:focus{outline:none;border-color:var(--navy-2);}
  .mf-header .link-btn{text-transform:none;font-weight:600;font-size:12.5px;}
  .mf-list{max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;}
  .mf-option{display:flex;align-items:center;gap:9px;font-size:13.5px;padding:7px 6px;border-radius:6px;cursor:pointer;}
  .mf-option:hover{background:#F5F6F8;}
  .mf-option input{cursor:pointer;}
  .mf-empty{font-size:13px;color:var(--ink-mute);padding:8px 6px;}
</style>
</head>
<body>
<div id="root"></div>
<script>

// ---------- Config ----------
const BACKEND_URL = "https://script.google.com/macros/s/AKfycbzeVf_4QSXQZYR8oBw5uZphTDG6BaF3Pky0OQgbj8240rHbX3TK2WiPWxg98_xmaMhP/exec";

const PASS_PCT = 80;

const state = {
  view: "login",   // login | test-select | loading-test | test | report | admin-gate | admin
  email: "",
  authChecking: false,
  authError: "",
  testCatalog: [],
  testSearchQuery: "",
  testStatuses: {},
  progressMap: {},

  testId: null,

  currentIndex: 0,

  adminUnlocked: false,

  adminError: false,
  adminCatalog: [],

  adminView: "per-test",       // "per-test" | "overall"
  allSubmissions: [],
  allSubmissionsLoaded: false,
  adminOverallLoading: false,
  memberFilter: [],
  memberFilterOpen: false,
  memberFilterSearch: "",

  // Evaluator workflow
  evaluatorCatalog: [],
  evaluatorCatalogLoading: false,

// ---------- Timer ----------
function startTimerFor(testId, startedAtIso){
  stopTimer();
  const meta = state.testCatalog.find(t => t.testId === testId);
  testDurationSec = meta && meta.durationMinutes ? meta.durationMinutes * 60 : 0;
  testStartedAtMs = startedAtIso ? new Date(startedAtIso).getTime() : Date.now();
  if (testDurationSec <= 0) return; // no time limit configured
  timerHandle = setInterval(updateTimerTick, 1000);
  updateTimerTick();
}
function stopTimer(){
  if (timerHandle){ clearInterval(timerHandle); timerHandle = null; }
  testStartedAtMs = null;
  testDurationSec = 0;
}
function updateTimerTick(){
  const el = document.getElementById('timer-display');
  if (!el){ return; }
  if (!testStartedAtMs || testDurationSec <= 0){ return; } // timer not actually initialized yet — safe no-op
  const elapsed = Math.floor((Date.now() - testStartedAtMs) / 1000);
  const remaining = testDurationSec - elapsed;
  if (remaining <= 0){
    el.textContent = "0:00";
    stopTimer();
    forceSubmitOnTimeout();
    return;
  }
  const m = Math.floor(remaining / 60);
  const s = remaining % 60;
  el.textContent = m + ":" + String(s).padStart(2,'0');
  el.parentElement.classList.toggle('warn', remaining <= 120);
}
async function forceSubmitOnTimeout(){
  state.timeExpired = true;
  await submitTest();
}

// ---------- Scoring ----------
function isQuestionAnswered(q){
  const a = state.answers[q.id];
  if (q.type === 'subjective'){
    return !!(a && typeof a === 'object' && a.text && a.text.trim().length > 0);
  }
  return typeof a === 'number';
}

function computeResult(answers){
  const allQuestions = currentQuestions();
  const mcqQuestions = allQuestions.filter(q => q.type !== 'subjective');
  const subjQuestions = allQuestions.filter(q => q.type === 'subjective');

  const mcqSections = [...new Set(mcqQuestions.map(q => q.section))];
  let correctCount = 0;
  const perQuestion = [];
  const sectionMap = {};
  mcqSections.forEach(s => sectionMap[s] = {correct:0, total:0});

  mcqQuestions.forEach(q => {
    const chosen = answers[q.id];
    const isCorrect = chosen === q.correct;
    if (isCorrect) correctCount++;
    sectionMap[q.section].total++;
    if (isCorrect) sectionMap[q.section].correct++;
    perQuestion.push({
      id: q.id, section: q.section, module: q.module, question: q.question,
      options: q.options, correctIndex: q.correct, chosenIndex: chosen, isCorrect
    });
  });

  const total = mcqQuestions.length;
  const pct = total > 0 ? Math.round((correctCount/total)*100) : 0;

  const subjectiveQuestions = subjQuestions.map(q => {
    const ans = answers[q.id];
    const answerText = (ans && typeof ans === 'object' && ans.text) ? ans.text : '';
    return {
      id: q.id, section: q.section, module: q.module, question: q.question,
      maxMarks: q.maxMarks, answerText: answerText,
      awardedMarks: null, feedback: '', evaluated: false
    };
  });

  return {
    correctCount, total, pct,
    pass: pct >= PASS_PCT,
    sectionScores: mcqSections.map(s => ({ section: s, ...sectionMap[s], pct: Math.round((sectionMap[s].correct/sectionMap[s].total)*100) })),
    perQuestion,
    hasSubjective: subjectiveQuestions.length > 0,
    subjective: {
      questions: subjectiveQuestions,
      totalMax: subjectiveQuestions.reduce((a,q)=>a+q.maxMarks,0),
      totalAwarded: 0,
      allEvaluated: subjectiveQuestions.length === 0,
      evaluatedBy: '',
      evaluatedAt: ''
    },
    timestamp: new Date().toISOString()
  };
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}) + ' ' + d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
}
// ---------- CSV export ----------
function downloadCSV(filename, headers, rows){
  const esc = (val) => {
    const str = String(val === undefined || val === null ? '' : val);
    if (/[",\n]/.test(str)) return '"' + str.replace(/"/g,'""') + '"';
    return str;
  };
  const lines = [headers.map(esc).join(',')];
  rows.forEach(r => lines.push(r.map(esc).join(',')));
  const csv = lines.join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function safeFilename(str){
  return String(str).replace(/[^a-z0-9]+/gi, '_').replace(/^_+|_+$/g,'').toLowerCase();
}

function aggregateSubmissionsByUser(subs){
  const byUser = {};
  subs.forEach(s => {
    if (!byUser[s.name]) byUser[s.name] = { count: 0, totalPct: 0, passCount: 0, testIds: new Set() };
    const u = byUser[s.name];
    u.count++;
    u.totalPct += s.result.pct;
    if (s.result.pass) u.passCount++;
    u.testIds.add(s.testId);
  });
  return Object.keys(byUser).map(email => {
    const u = byUser[email];
    return {
      email, testsTaken: u.testIds.size, totalAttempts: u.count,
      avgPct: Math.round(u.totalPct / u.count), passCount: u.passCount
    };
  }).sort((a,b) => b.avgPct - a.avgPct);
}

function scoreColor(pct){
  if (pct >= PASS_PCT) return 'var(--green)';
  if (pct >= 60) return 'var(--amber)';
  return 'var(--red)';
}

function testCardStatus(testId){
  const sub = state.testStatuses[testId];
  const prog = state.progressMap[testId];
  if (sub) return { kind: 'completed', sub };
  if (prog && prog.answers && Object.keys(prog.answers).length > 0) return { kind: 'in-progress', prog };
  return { kind: 'not-started' };
}

function renderTestSelect(){
  const query = state.testSearchQuery.trim().toLowerCase();
  const filtered = state.testCatalog.filter(t =>
    !query || t.name.toLowerCase().includes(query) || (t.description||'').toLowerCase().includes(query)
  );

  const cards = filtered.map(test => {
    const testId = test.testId;
    const st = testCardStatus(testId);
    const total = test.questionCount;

    let pill, actions;
    if (st.kind === 'completed'){
      pill = `<span class="status-pill completed">Completed — ${st.sub.result.pct}%</span>`;
      actions = `
        <button class="btn btn-primary" onclick="viewPastResult('${testId}')">View my result</button>
        <button class="btn btn-ghost" onclick="retakeTest('${testId}')">Retake</button>`;
    } else if (st.kind === 'in-progress'){
      const answered = Object.keys(st.prog.answers).length;
      pill = `<span class="status-pill in-progress">In progress — ${answered}/${total}</span>`;
      actions = `
        <button class="btn btn-primary" onclick="resumeTest('${testId}')">Resume</button>
        <button class="btn btn-ghost" onclick="retakeTest('${testId}')">Start over</button>`;
    } else {
      pill = `<span class="status-pill not-started">Not started · ${total} questions${test.durationMinutes ? ' · ' + test.durationMinutes + ' min' : ''}</span>`;
      actions = `<button class="btn btn-primary" onclick="beginTest('${testId}')">Start test</button>`;
    }

    return `
      <div class="card test-card">
        <div class="ttop">
          <div>
            <h3>${escapeHtml(test.name)}</h3>
            <p>${escapeHtml(test.description || '')}</p>
          </div>
          ${pill}
        </div>
        <div class="tactions">${actions}</div>
      </div>`;
  }).join("");

  const empty = filtered.length === 0 ? `
    <div class="empty-state card pad">
      ${state.testCatalog.length === 0 ? 'No assessments are published yet.' : 'No assessments match your search.'}
    </div>` : '';

  return `

      <h2 style="margin-bottom:4px;">Available Assessments</h2>

            </div>
            <div class="r-status" style="background:var(--navy-2);color:#fff;">${q.awardedMarks} / ${q.maxMarks}</div>
          </div>
          <div class="ropt" style="background:#F5F6F8;">${escapeHtml(q.answerText || '(no answer given)')}</div>
          ${q.feedback ? `<div class="ropt correct-answer" style="margin-top:6px;"><b>Evaluator feedback:</b>&nbsp;${escapeHtml(q.feedback)}</div>` : ''}
        </div>`;
    }
    return `
      <div class="review-item card" style="border-left-color:var(--amber);">
        <div class="rtop">
          <div>
            <div class="rq">Q${q.id}. ${escapeHtml(q.question)}</div>
            <div class="rmod">Related Module: ${escapeHtml(q.module)} · Worth ${q.maxMarks} mark${q.maxMarks!==1?'s':''}</div>
          </div>
          <div class="r-status" style="background:var(--amber-soft);color:var(--amber);">Pending evaluation</div>
        </div>
        <div class="ropt" style="background:#F5F6F8;">${escapeHtml(q.answerText || '(no answer given)')}</div>
      </div>`;
  }).join("");

  return `
    <div class="section-title-row"><h3>Subjective questions</h3></div>
    <div style="margin-top:14px;">${items}</div>`;
}

function renderReport(){
  const r = state.result;
  const testMeta = state.testCatalog.find(t => t.testId === state.testId);
  const testName = testMeta ? testMeta.name : state.testId;
  return `
    ${renderTopbar('inTest')}
    <div class="app">
      ${state.viewingPastResult ? `
        <div class="card pad" style="margin-bottom:16px;border-color:var(--navy-2);background:#EEF3F8;">
          <b>Viewing a previous submission</b> — ${escapeHtml(testName)}, from ${fmtDate(r.timestamp)}.
        </div>` : ''}
      ${state.timeExpired && !state.viewingPastResult ? `
        <div class="card pad" style="margin-bottom:16px;border-color:var(--red);background:var(--red-soft);">
          <b>Time's up</b> — this test auto-submitted because the time limit was reached. Answers you'd made before then are scored below.
        </div>` : ''}
      ${r.hasSubjective && !r.subjective.allEvaluated ? `
        <div class="card pad" style="margin-bottom:16px;border-color:var(--amber);background:var(--amber-soft);">
          <b>${r.subjective.questions.filter(q=>!q.evaluated).length} subjective question(s) awaiting evaluation</b> — the score below covers only the auto-graded (multiple-choice) portion. Your final score will update once an evaluator reviews your written answers.
        </div>` : ''}
      ${r.hasSubjective && r.subjective.allEvaluated ? `
        <div class="card pad" style="margin-bottom:16px;border-color:var(--green);background:var(--green-soft);">
          <b>Subjective answers evaluated</b> — you scored ${r.subjective.totalAwarded} / ${r.subjective.totalMax} on the written portion (see below).
        </div>` : ''}
      <div class="card score-hero">
        ${renderGauge(r.pct)}
        <div class="score-side">
          <span class="badge ${r.pass?'pass':'fail'}">${r.pass?'Passed':'Needs Review'}</span>
          <h2 style="margin-top:10px;">${escapeHtml(testName)} — ${r.correctCount} / ${r.total}${r.hasSubjective ? ' (multiple-choice)' : ''}</h2>
          <p>${r.pass
            ? "Strong grasp of the material covered. Review any missed items below to close the remaining gaps."

        </div>
      </div>

      <div class="section-title-row"><h3>Review your answers</h3></div>

        <div class="filter-chip ${state.reviewFilter==='correct'?'active':''}" onclick="setReviewFilter('correct')">Correct (${r.correctCount})</div>
      </div>

      ${renderSubjectiveReviewSection(r)}

}

function renderMyOverallSummary(){
  const subs = Object.values(state.testStatuses);
  const totalTests = state.testCatalog.length;
  const completed = subs.length;
  if (completed === 0){
    return `
      <div class="card pad" style="margin-bottom:22px;">
        <div style="color:var(--ink-mute);font-size:13.5px;">You haven't completed any assessments yet — 0 of ${totalTests} published.</div>
      </div>`;
  }
  const avgPct = Math.round(subs.reduce((a,s)=>a+s.result.pct,0)/completed);
  const passCount = subs.filter(s=>s.result.pass).length;
  return `
    <div class="kpi-grid" style="margin-bottom:22px;">
      <div class="card kpi"><div class="n">${completed}/${totalTests}</div><div class="l">Assessments completed</div></div>
      <div class="card kpi"><div class="n">${avgPct}%</div><div class="l">Your overall average score</div></div>
      <div class="card kpi"><div class="n">${passCount}/${completed}</div><div class="l">Passed</div></div>
    </div>`;
}

  const visibleEmails = query ? availableEmails.filter(e => e.toLowerCase().includes(query)) : availableEmails;
  const options = visibleEmails.map(email => {
    const checked = state.memberFilter.includes(email);
    return `
      <label class="mf-option">

function renderEvaluator(){
  if (state.evaluatorCatalogLoading){
    return `${renderTopbar('admin')}<div class="app wide"><div class="loading-inline"><div class="spinner"></div> Loading evaluator data…</div></div>`;
  }
  if (state.evaluatorCatalog.length === 0){
    return `${renderTopbar('admin')}<div class="app wide">
      <div class="empty-state card pad">No assessments currently contain subjective questions to evaluate.</div>
    </div>`;
  }

  const selectOptions = state.evaluatorCatalog.map(t =>
    `<option value="${escapeHtml(t.testId)}" ${state.evaluatorTestId===t.testId?'selected':''}>${escapeHtml(t.name)}</option>`
  ).join("");
  const selector = `<div class="admin-select-wrap"><select onchange="switchEvaluatorTest(this.value)">${selectOptions}</select></div>`;

  if (state.evaluatorSelectedIdx !== null){
    return `${renderTopbar('admin')}<div class="app wide">${renderEvaluationForm()}</div>`;
  }

  if (state.evaluatorLoading){
    return `${renderTopbar('admin')}<div class="app wide">${selector}<div class="loading-inline"><div class="spinner"></div> Loading submissions…</div></div>`;
  }

  const subs = state.evaluatorSubmissions;
  const testMeta = state.evaluatorCatalog.find(t => t.testId === state.evaluatorTestId);

  if (subs.length === 0){
    return `${renderTopbar('admin')}<div class="app wide">${selector}<div class="empty-state card pad">No submissions yet for "${escapeHtml(testMeta ? testMeta.name : state.evaluatorTestId)}".</div></div>`;
  }

  const rows = subs.slice().sort((a,b)=> new Date(b.timestamp)-new Date(a.timestamp)).map(s => {
    const realIdx = subs.indexOf(s);
    const subj = s.result.subjective;
    const evaluatedCount = subj ? subj.questions.filter(q=>q.evaluated).length : 0;
    const totalQ = subj ? subj.questions.length : 0;
    const complete = subj && subj.allEvaluated;
    const canEvaluate = !!s.submissionId;
    return `
      <tr class="${canEvaluate ? 'clickable' : ''}" ${canEvaluate ? `onclick="openEvaluationForm(${realIdx})"` : ''}>
        <td>${escapeHtml(s.name)}</td>
        <td class="mono">${fmtDate(s.timestamp)}</td>
        <td>${evaluatedCount} / ${totalQ} evaluated</td>
        <td><span class="score-pill ${complete?'pass':'fail'}">${complete ? 'Complete' : 'Pending'}</span></td>
        <td>${canEvaluate ? '' : '<span style="font-size:12px;color:var(--ink-mute);">No ID — predates evaluation feature</span>'}</td>
      </tr>`;
  }).join("");

  const pendingCount = subs.filter(s => s.result.subjective && !s.result.subjective.allEvaluated).length;

  return `
    ${renderTopbar('admin')}
    <div class="app wide">
      ${selector}
      <h2 style="margin-bottom:4px;">${escapeHtml(testMeta ? testMeta.name : state.evaluatorTestId)} — Evaluate Answers</h2>
      <p style="color:var(--ink-mute);font-size:13.5px;margin-top:0;">${subs.length} submission${subs.length!==1?'s':''} · ${pendingCount} awaiting evaluation</p>
      <div class="card" style="overflow:hidden;">
        <table class="admin-table">
          <thead><tr><th>Email</th><th>Submitted</th><th>Progress</th><th>Status</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
}

    ${items}
    <button class="btn btn-primary" ${state.evaluatorSaving?'disabled style="opacity:.6;"':''} onclick="submitEvaluation()">${state.evaluatorSaving ? 'Saving…' : 'Save Evaluation'}</button>
  `;
}

function renderAdmin(){
  if (state.adminCatalogLoading){
    return `${renderTopbar('admin')}<div class="app wide"><div class="loading-inline"><div class="spinner"></div> Assessment data is loading…</div></div>`;
  }
  if (state.adminCatalog.length === 0){
    return `${renderTopbar('admin')}<div class="app wide"><div class="empty-state card pad">No assessments published yet.</div></div>`;
  }

  if (state.adminView === 'overall'){
    return renderAdminOverall();
  }

  const selectOptions = state.adminCatalog.map(t =>
    `<option value="${escapeHtml(t.testId)}" ${state.adminTestId===t.testId?'selected':''}>${escapeHtml(t.name)}</option>`
  ).join("");

  const selector = `
    <div class="admin-select-wrap">
      <select onchange="switchAdminTest(this.value)">${selectOptions}</select>
    </div>`;

  if (state.adminLoading){
    return `${renderTopbar('admin')}<div class="app wide">${renderAdminViewToggle()}${selector}<div class="loading-inline"><div class="spinner"></div> Loading results…</div></div>`;
  }

  if (state.selectedSubmissionIdx !== null){
    const sub = state.submissions[state.selectedSubmissionIdx];
    return `${renderTopbar('admin')}<div class="app wide">${renderAdminDetail(sub)}</div>`;
  }

  const subs = state.submissions;
  const testMeta = state.adminCatalog.find(t => t.testId === state.adminTestId);
  const allEmails = [...new Set(subs.map(s => s.name))].sort();
  const filteredSubs = state.memberFilter.length ? subs.filter(s => state.memberFilter.includes(s.name)) : subs;

  if (subs.length === 0){
    return `${renderTopbar('admin')}<div class="app wide">
      ${renderAdminViewToggle()}
      ${selector}
      <div class="empty-state card pad">
        <div class="big">📋</div>
        No submissions yet for "${escapeHtml(testMeta ? testMeta.name : state.adminTestId)}".
      </div>
    </div>`;
  }

  if (filteredSubs.length === 0){
    return `${renderTopbar('admin')}<div class="app wide">
      ${renderAdminViewToggle()}
      <div class="admin-controls-row">
        ${selector}
        ${renderMemberFilter(allEmails)}
      </div>
      <div class="empty-state card pad">No submissions match the selected member filter.</div>
    </div>`;
  }

  const avgPct = Math.round(filteredSubs.reduce((a,s)=>a+s.result.pct,0)/filteredSubs.length);
  const passCount = filteredSubs.filter(s=>s.result.pass).length;
  const passRate = Math.round((passCount/filteredSubs.length)*100);

  const secAgg = {};
  filteredSubs.forEach(s => s.result.sectionScores.forEach(ss => {
    if (!secAgg[ss.section]) secAgg[ss.section] = {correct:0,total:0};
    secAgg[ss.section].correct += ss.correct;
    secAgg[ss.section].total += ss.total;
  }));
  const weakSections = Object.keys(secAgg).map(s => ({
    section: s, pct: Math.round((secAgg[s].correct/secAgg[s].total)*100)
  })).sort((a,b)=>a.pct-b.pct);

  const rows = filteredSubs.slice().sort((a,b)=> new Date(b.timestamp)-new Date(a.timestamp)).map((s) => {
    const realIdx = subs.indexOf(s);
    return `
      <tr class="clickable" onclick="state.selectedSubmissionIdx=${realIdx}; render()">
        <td>${escapeHtml(s.name)}</td>
        <td class="mono">${fmtDate(s.timestamp)}</td>
        <td>${s.result.correctCount} / ${s.result.total}</td>
        <td><span class="score-pill ${s.result.pass?'pass':'fail'}">${s.result.pct}%</span></td>
        <td>${s.result.pass ? 'Passed' : 'Needs review'}</td>
      </tr>`;
  }).join("");

  const weakHtml = weakSections.slice(0,5).map(w => `
    <div class="wrow">
      <span>${escapeHtml(w.section)}</span>
      <span class="mono" style="color:${scoreColor(w.pct)};font-weight:600;">${w.pct}%</span>
    </div>`).join("");

  return `
    ${renderTopbar('admin')}
    <div class="app wide">
      ${renderAdminViewToggle()}
      <div class="admin-controls-row">
        ${selector}
        ${renderMemberFilter(allEmails)}
      </div>
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;">
        <div>
          <h2 style="margin-bottom:4px;">${escapeHtml(testMeta ? testMeta.name : state.adminTestId)} — Team Performance</h2>
          <p style="color:var(--ink-mute);font-size:13.5px;margin-top:0;">${filteredSubs.length} submission${filteredSubs.length!==1?'s':''} recorded${state.memberFilter.length ? ' (filtered)' : ''}</p>
        </div>
        <button class="btn btn-ghost" onclick="exportPerTestCSV()">⬇ Download CSV</button>
      </div>

      <div class="kpi-grid">
        <div class="card kpi"><div class="n">${filteredSubs.length}</div><div class="l">Team members tested</div></div>
        <div class="card kpi"><div class="n">${avgPct}%</div><div class="l">Average score</div></div>
        <div class="card kpi"><div class="n">${passRate}%</div><div class="l">Pass rate (≥${PASS_PCT}%)</div></div>
        <div class="card kpi"><div class="n">${passCount}/${filteredSubs.length}</div><div class="l">Passed the assessment</div></div>
      </div>

      <div class="card pad" style="margin-bottom:24px;">
        <h3 style="margin:0 0 14px;font-size:15px;">Lowest-scoring sections across the team</h3>
        <div class="weak-list">${weakHtml}</div>
      </div>

      <div class="card" style="overflow:hidden;">
        <table class="admin-table">
          <thead><tr><th>Email</th><th>Submitted</th><th>Score</th><th>%</th><th>Result</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
}

function render(){
  const ae = document.activeElement;
  let activeId = null, selStart = null, selEnd = null;
  if (ae && ae.id){
    activeId = ae.id;
    if (typeof ae.selectionStart === 'number'){ selStart = ae.selectionStart; selEnd = ae.selectionEnd; }
  }

  document.getElementById("root").innerHTML =
    state.view === "config-missing" ? renderConfigMissing() :
    state.view === "login" ? renderLogin() :
    state.view === "restoring-session" ? renderRestoringSession() :
    state.view === "test-select" ? renderTestSelect() :
    state.view === "loading-test" ? renderLoadingTest() :
    state.view === "test" ? renderTest() :
    state.view === "report" ? renderReport() :
    state.view === "admin-gate" ? renderAdminGate() :
    state.view === "admin" ? renderAdmin() :
    state.view === "evaluator" ? renderEvaluator() :
    state.view === "my-results" ? renderMyResults() : "";

  if (activeId){
    const el = document.getElementById(activeId);
    if (el){
      el.focus();
      if (selStart !== null && el.setSelectionRange){
        try { el.setSelectionRange(selStart, selEnd); } catch(e){}
      }
    }
  }

  // Post-render hooks that need real DOM nodes to exist
  if (state.view === "login" && !state.authChecking && googleConfigured()){
    renderGoogleButton();
  }
  if (state.view === "test"){
    updateTimerTick();
  }
}

// ---------- Google Sign-In ----------
window.__onGsiReady = function(){
  if (!googleConfigured()) return;
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleGoogleCredential,
    auto_select: false,
    hd: ALLOWED_EMAIL_DOMAIN || undefined
  });
  if (state.view === "login") renderGoogleButton();
};
if (window.__gsiLoaded) { window.__onGsiReady(); }

function renderGoogleButton(){
  const el = document.getElementById('gsi-button-container');
  if (!el || typeof google === 'undefined' || !google.accounts) return;
  el.innerHTML = "";
  google.accounts.id.renderButton(el, { theme: 'outline', size: 'large', width: 320 });
}

async function handleGoogleCredential(response){
  state.authChecking = true;
  state.authError = "";
  render();

  const result = await verifyGoogleToken(response.credential);
  console.log("Google auth verify result:", result);
  if (!result.valid){
    state.authChecking = false;
    state.authError = result.reason === "domain_not_allowed"
      ? "Please sign in with your @meritto.com Google account."
      : "Could not verify your Google sign-in (reason: " + (result.reason || "unknown") + "). Please try again.";
    render();
    return;
  }

  state.email = result.email;
  try { localStorage.setItem(SESSION_KEY, JSON.stringify({ email: state.email, ts: Date.now() })); } catch(e){}

  const [catalog, statuses, progress] = await Promise.all([
    fetchTestCatalog(),
    fetchStatusForEmail(state.email),
    fetchAllProgress()
  ]);
  state.testCatalog = catalog;
  state.testStatuses = statuses;
  state.progressMap = progress;
  state.authChecking = false;
  state.view = "test-select";
  render();
}

function logout(){
  try { if (typeof google !== 'undefined' && google.accounts) google.accounts.id.disableAutoSelect(); } catch(e) {}
  try { localStorage.removeItem(SESSION_KEY); } catch(e){}
  state.email = "";
  state.testCatalog = [];
  state.testStatuses = {};
  state.progressMap = {};
  state.questionsCache = {};
  state.testId = null;
  state.testSearchQuery = "";
  state.authError = "";
  state.view = "login";
  render();
}

function setTestSearch(val){
  state.testSearchQuery = val;
  render();
}

function exitToTestSelect(){
  stopTimer();
  state.view = "test-select";
  state.answers = {};
  state.result = null;
  state.currentIndex = 0;
  state.testId = null;
  state.timeExpired = false;
  state.showLeaveWarning = false;
  render();
  refreshTestSelectData();
}

async function refreshTestSelectData(){
  const [catalog, statuses, progress] = await Promise.all([
    fetchTestCatalog(),
    fetchStatusForEmail(state.email),
    fetchAllProgress()
  ]);
  state.testCatalog = catalog;
  state.testStatuses = statuses;
  state.progressMap = progress;
  render();
}

async function beginTest(testId){
  state.testId = testId;
  state.view = "loading-test";
  render();
  await ensureQuestionsLoaded(testId);
  state.answers = {};
  state.currentIndex = 0;
  state.viewingPastResult = false;
  state.timeExpired = false;
  state.view = "test";
  startTimerFor(testId, null);
  render();
  window.scrollTo(0,0);
  saveProgressRemote();
}

async function resumeTest(testId){
  state.testId = testId;
  state.view = "loading-test";
  render();
  await ensureQuestionsLoaded(testId);
  const prog = state.progressMap[testId];
  state.answers = (prog && prog.answers) || {};
  state.currentIndex = Math.min((prog && prog.currentIndex) || 0, currentTotalQ() - 1);
  state.viewingPastResult = false;
  state.timeExpired = false;
  state.view = "test";
  startTimerFor(testId, prog && prog.startedAt ? prog.startedAt : null);
  render();
  window.scrollTo(0,0);
}

async function retakeTest(testId){
  await clearProgressRemote(testId);
  delete state.progressMap[testId];
  beginTest(testId);
}

function viewPastResult(testId){
  stopTimer();
  const sub = state.testStatuses[testId];
  state.testId = testId;
  state.result = sub.result;
  state.viewingPastResult = true;
  state.reviewFilter = "all";
  state.view = "report";
  render();
  window.scrollTo(0,0);
}

// ---------- Test taking ----------
function selectOption(qid, idx){
  state.answers[qid] = idx;
  render();
  saveProgressRemote();
}

function setSubjectiveAnswer(qid, text){
  state.answers[qid] = { type: 'subjective', text: text };
  // Note: intentionally not calling render() on every keystroke (would rebuild the
  // navigator/progress bar constantly); saved on blur instead via saveProgressRemote().
}

function goNext(){
  if (state.currentIndex < currentTotalQ() - 1){
    state.currentIndex++;
    render();
    window.scrollTo(0,0);
    saveProgressRemote();
  }
}
function goPrev(){
  if (state.currentIndex > 0){
    state.currentIndex--;
    render();
    window.scrollTo(0,0);
    saveProgressRemote();
  }
}
function jumpToQuestion(idx){
  state.currentIndex = idx;
  render();
  window.scrollTo(0,0);
  saveProgressRemote();
}

function attemptSubmit(){
  const questions = currentQuestions();
  const answeredCount = questions.filter(isQuestionAnswered).length;
  if (answeredCount < questions.length){
    const firstUnanswered = questions.findIndex(q => !isQuestionAnswered(q));
    if (!confirm(`You still have ${questions.length - answeredCount} unanswered question(s). Go to the first unanswered question?`)) return;
    state.currentIndex = firstUnanswered;
    render();
    window.scrollTo(0,0);
    return;
  }
  submitTest();
}

// ---------- Leave-test warning (triggered by clicking Home mid-test) ----------
function attemptLeaveTest(){
  state.showLeaveWarning = true;
  render();
}
function cancelLeaveWarning(){
  state.showLeaveWarning = false;
  render();
}
function confirmSubmitFromWarning(){
  state.showLeaveWarning = false;
  attemptSubmit();
}
function confirmLeaveWithoutSubmitting(){
  state.showLeaveWarning = false;
  exitToTestSelect();
}

async function submitTest(){
  stopTimer();
  const result = computeResult(state.answers);
  const submissionId = generateSubmissionId();
  state.result = result;
  state.viewingPastResult = false;
  state.view = "report";
  render();
  window.scrollTo(0,0);
  try {
    await submitRemote(result, submissionId);
    state.testStatuses[state.testId] = { timestamp: result.timestamp, email: state.email, testId: state.testId, result: result, submissionId: submissionId };
  } catch(e) { /* still show the report even if save fails */ }
}

function setReviewFilter(f){
  state.reviewFilter = f;
  render();
}

// ---------- Admin ----------
// ---------- My Results ----------
function goMyResults(){
  state.view = "my-results";
  if (!state.myResultsTestId && state.testCatalog.length){
    state.myResultsTestId = state.testCatalog[0].testId;
  }
  render();
}

function switchMyResultsTest(testId){
  state.myResultsTestId = testId;
  render();
}

// ---------- Admin ----------
function goHomeFromAdmin(){
  if (state.email){
    state.view = "test-select";
    render();
    refreshTestSelectData();
  } else {
    state.view = "login";
    render();
  }
}

async function goAdmin(){
  state.pendingViewAfterUnlock = "admin";
  state.view = state.adminUnlocked ? "admin" : "admin-gate";
  state.selectedSubmissionIdx = null;
  if (state.adminUnlocked && state.adminCatalog.length === 0){
    state.adminCatalogLoading = true;
  }
  render();
  if (state.adminUnlocked) {
    if (state.adminCatalog.length === 0){
      state.adminCatalog = await fetchTestCatalog();
      state.adminTestId = state.adminCatalog.length ? state.adminCatalog[0].testId : null;
      state.adminCatalogLoading = false;
    }
    loadAdminData();
  }
}

async function goEvaluatorEntry(){
  state.pendingViewAfterUnlock = "evaluator";
  if (state.adminUnlocked){
    goEvaluator();
  } else {
    state.view = "admin-gate";
    render();
  }
}

async function goEvaluator(){
  state.view = "evaluator";
  state.evaluatorSelectedIdx = null;
  render();

  if (state.evaluatorCatalog.length === 0){
    state.evaluatorCatalogLoading = true;
    render();
    const all = await fetchTestCatalog();
    state.evaluatorCatalog = all.filter(t => t.hasSubjective);
    state.evaluatorTestId = state.evaluatorCatalog.length ? state.evaluatorCatalog[0].testId : null;
    state.evaluatorCatalogLoading = false;
    render();
  }

  if (state.evaluatorTestId){
    loadEvaluatorSubmissions();
  }
}

function switchEvaluatorTest(testId){
  state.evaluatorTestId = testId;
  state.evaluatorSelectedIdx = null;
  loadEvaluatorSubmissions();
}

async function loadEvaluatorSubmissions(){
  state.evaluatorLoading = true;
  render();
  state.evaluatorSubmissions = await loadSubmissionsForAdmin(state.evaluatorTestId);
  state.evaluatorLoading = false;
  render();
}

function openEvaluationForm(idx){
  state.evaluatorSelectedIdx = idx;
  const sub = state.evaluatorSubmissions[idx];
  state.evalMarksDraft = {};
  state.evalFeedbackDraft = {};
  if (sub.result.subjective){
    sub.result.subjective.questions.forEach(q => {
      state.evalMarksDraft[q.id] = q.evaluated ? String(q.awardedMarks) : "";
      state.evalFeedbackDraft[q.id] = q.feedback || "";
    });
  }
  render();
}

function setEvalMarks(qid, val){
  state.evalMarksDraft[qid] = val;
}
function setEvalFeedback(qid, val){
  state.evalFeedbackDraft[qid] = val;
}

async function submitEvaluation(){
  const sub = state.evaluatorSubmissions[state.evaluatorSelectedIdx];
  if (!sub || !sub.submissionId){
    alert("This submission doesn't have an evaluation ID (it may predate this feature) and can't be evaluated.");
    return;
  }
  state.evaluatorSaving = true;
  render();

  const marks = {};
  const feedback = {};
  sub.result.subjective.questions.forEach(q => {
    const val = state.evalMarksDraft[q.id];
    if (val !== "" && val !== undefined && val !== null){
      marks[q.id] = val;
      feedback[q.id] = state.evalFeedbackDraft[q.id] || "";
    }
  });

  try {
    await saveEvaluationRemote(state.evaluatorTestId, sub.submissionId, marks, feedback);
  } catch(e) { /* non-fatal, list refresh below will show current saved state either way */ }

  state.evaluatorSaving = false;
  state.evaluatorSelectedIdx = null;
  await loadEvaluatorSubmissions();
}

async function checkAdminCode(){
  if (state.adminCodeInput === ADMIN_CODE){
    state.adminUnlocked = true;
    state.adminError = false;
    if (state.pendingViewAfterUnlock === "evaluator"){
      goEvaluator();
    } else {
      state.view = "admin";
      state.adminCatalogLoading = true;
      render();
      state.adminCatalog = await fetchTestCatalog();
      state.adminTestId = state.adminCatalog.length ? state.adminCatalog[0].testId : null;
      state.adminCatalogLoading = false;
      loadAdminData();
    }
  } else {
    state.adminError = true;
    render();
  }
}

function switchAdminTest(testId){
  state.adminTestId = testId;
  state.selectedSubmissionIdx = null;
  state.memberFilter = [];
  state.memberFilterOpen = false;
  loadAdminData();
}

async function switchAdminView(view){
  state.adminView = view;
  state.selectedSubmissionIdx = null;
  state.memberFilterOpen = false;
  if (view === 'overall'){
    state.adminOverallLoading = true;
    render();
    state.allSubmissions = await loadAllSubmissionsForAdmin();
    state.adminOverallLoading = false;
  }
  render();
}

function toggleMemberFilterPanel(evt){
  if (evt) evt.stopPropagation();
  state.memberFilterOpen = !state.memberFilterOpen;
  if (!state.memberFilterOpen) state.memberFilterSearch = "";
  render();
}
function toggleMemberFilter(email){
  const idx = state.memberFilter.indexOf(email);
  if (idx === -1) state.memberFilter.push(email);
  else state.memberFilter.splice(idx, 1);
  render();
}
function setMemberFilterSearch(val){
  state.memberFilterSearch = val;
  render();
}
function closeMemberFilterPanel(){
  state.memberFilterOpen = false;
  state.memberFilterSearch = "";
  render();
}
function clearMemberFilter(){
  state.memberFilter = [];
  state.memberFilterOpen = false;
  state.memberFilterSearch = "";
  render();
}

// ---------- CSV exports ----------
function applyMemberFilter(subs){
  return state.memberFilter.length ? subs.filter(s => state.memberFilter.includes(s.name)) : subs;
}

function exportPerTestCSV(){
  const testMeta = state.adminCatalog.find(t => t.testId === state.adminTestId);
  const testName = testMeta ? testMeta.name : state.adminTestId;
  const headers = ["Email","Submitted","Score","Percent","Result"];
  const rows = applyMemberFilter(state.submissions)
    .slice()
    .sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp))
    .map(s => [s.name, fmtDate(s.timestamp), `${s.result.correctCount}/${s.result.total}`, s.result.pct + "%", s.result.pass ? "Passed" : "Needs review"]);
  downloadCSV(safeFilename(testName) + "_results.csv", headers, rows);
}

function exportOverallCSV(){
  const userRows = aggregateSubmissionsByUser(applyMemberFilter(state.allSubmissions || []));
  const headers = ["Email","Assessments Taken","Total Submissions","Avg Score","Passed"];
  const rows = userRows.map(u => [u.email, u.testsTaken, u.totalAttempts, u.avgPct + "%", `${u.passCount}/${u.totalAttempts}`]);
  downloadCSV("overall_team_performance.csv", headers, rows);
}

function exportMyResultCSV(){
  const meta = state.testCatalog.find(t => t.testId === state.myResultsTestId);
  const sub = state.testStatuses[state.myResultsTestId];
  if (!sub) return;
  const r = sub.result;
  const headers = ["Question #","Module","Question","Your Answer","Correct Answer","Result"];
  const rows = r.perQuestion.map(q => [
    q.id, q.module, q.question,
    q.chosenIndex !== undefined ? q.options[q.chosenIndex] : "(not answered)",
    q.options[q.correctIndex],
    q.isCorrect ? "Correct" : "Incorrect"
  ]);
  downloadCSV(safeFilename((meta ? meta.name : state.myResultsTestId) + "_" + state.email) + ".csv", headers, rows);
}

async function loadAdminData(){
  if (!state.adminTestId){ state.adminLoading = false; render(); return; }
  state.adminLoading = true;
  render();
  const subs = await loadSubmissionsForAdmin(state.adminTestId);
  state.submissions = subs;
  state.adminLoading = false;
  render();
}

// ---------- Init ----------
async function initApp(){
  if (!backendConfigured()){
    state.view = "config-missing";
    render();
    return;
  }

  let session = null;
  try { session = JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); } catch(e){}

  if (session && session.email){
    state.email = session.email;
    state.view = "restoring-session";
    render();
    const [catalog, statuses, progress] = await Promise.all([
      fetchTestCatalog(),
      fetchStatusForEmail(state.email),
      fetchAllProgress()
    ]);
    state.testCatalog = catalog;
    state.testStatuses = statuses;
    state.progressMap = progress;
    state.view = "test-select";
    render();
  } else {
    render();
  }
}
initApp();
</script>
</body>
</html>
