<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ops Knowledge Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer onload="window.__gsiLoaded=true; if(window.__onGsiReady) window.__onGsiReady();"></script>
<style>
  :root{
    --navy:#12233F;
    --navy-2:#1F4E78;
    --amber:#D98E2B;
    --amber-soft:#F6E4C2;
    --green:#1E8A5B;
    --green-soft:#E4F5EC;
    --red:#C0392B;
    --red-soft:#FBE6E3;
    --bg:#F2F3F6;
    --card:#FFFFFF;
    --line:#E3E6EC;
    --ink:#151B2B;
    --ink-mute:#5B6579;
    --radius:14px;
    --shadow:0 1px 2px rgba(18,35,63,0.06), 0 8px 24px rgba(18,35,63,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.display{font-family:'Sora',system-ui,sans-serif; letter-spacing:-0.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .app{max-width:900px;margin:0 auto;padding:28px 20px 80px;}
  .app.wide{max-width:1080px;}

  /* ---- top bar ---- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px;background:var(--navy);color:#fff;
    position:sticky;top:0;z-index:50;
  }
  .topbar .brand{display:flex;align-items:center;gap:10px;font-family:'Sora';font-weight:700;font-size:15px;}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--amber);}
  .topbar .meta{font-size:13px;color:#B9C4D6;}
  .topbar .actions{display:flex;gap:10px;align-items:center;}
  .link-btn{background:none;border:none;color:#CBD6E8;font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-family:'Inter';}
  .link-btn:hover{color:#fff;}

  /* ---- generic card ---- */
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);}
  .pad{padding:28px;}

  /* ---- landing ---- */
  .landing-wrap{display:flex;min-height:calc(100vh - 60px);align-items:center;justify-content:center;padding:40px 20px;}
  .landing-card{max-width:480px;width:100%;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);font-weight:600;}
  .landing-card h1{font-size:28px;margin:10px 0 6px;line-height:1.2;}
  .landing-card p.sub{color:var(--ink-mute);font-size:14.5px;line-height:1.6;margin:0 0 24px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--ink);}
  .field input{
    width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;
    font-size:15px;font-family:'Inter';background:#FBFBFD;
  }
  .field input:focus{outline:none;border-color:var(--navy-2);background:#fff;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:13px 22px;border-radius:10px;font-weight:600;font-size:14.5px;
    border:none;cursor:pointer;font-family:'Inter';transition:transform .08s ease, box-shadow .15s ease;
  }
  .btn-primary{background:var(--navy-2);color:#fff;width:100%;margin-top:18px;}
  .btn-primary:hover{background:#173D5E;}
  .btn-primary:disabled{background:#B9C2CE;cursor:not-allowed;}
  .btn-primary:active{transform:scale(.99);}
  .btn-ghost{background:transparent;color:var(--navy-2);border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--navy-2);}
  .stat-row{display:flex;gap:18px;margin-top:22px;padding-top:20px;border-top:1px solid var(--line);}
  .stat-row .s{flex:1;}
  .stat-row .s .n{font-family:'Sora';font-weight:700;font-size:20px;color:var(--navy);}
  .stat-row .s .l{font-size:11.5px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}

  /* ---- test screen ---- */
  .progress-shell{
    position:sticky;top:57px;z-index:40;background:var(--bg);
    padding:14px 0 10px;
  }
  .progress-shell .inner{
    display:flex;align-items:center;gap:14px;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:12px 16px;box-shadow:var(--shadow);
  }
  .progress-bar{flex:1;height:8px;background:#E9EBF0;border-radius:6px;overflow:hidden;}
  .progress-bar .fill{height:100%;background:linear-gradient(90deg,var(--navy-2),var(--amber));border-radius:6px;transition:width .25s ease;}
  .progress-count{font-family:'IBM Plex Mono';font-size:13px;color:var(--ink-mute);white-space:nowrap;}

  .section-heading{
    margin:34px 0 14px;display:flex;align-items:baseline;gap:10px;
  }
  .section-heading .idx{font-family:'IBM Plex Mono';font-size:12px;color:var(--amber);font-weight:600;}
  .section-heading h2{font-size:17px;margin:0;color:var(--navy);}

  .qcard{padding:22px 24px;margin-bottom:14px;}
  .qcard .qtop{display:flex;gap:10px;align-items:flex-start;margin-bottom:4px;}
  .qnum{font-family:'IBM Plex Mono';font-weight:600;color:var(--navy-2);font-size:14px;min-width:34px;}
  .qtext{font-size:15px;line-height:1.55;font-weight:500;}
  .qmodule{font-size:11.5px;color:var(--ink-mute);margin:6px 0 16px 44px;font-style:italic;}
  .options{display:flex;flex-direction:column;gap:8px;margin-left:44px;}
  .opt{
    display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border:1.5px solid var(--line);
    border-radius:9px;cursor:pointer;font-size:14px;line-height:1.5;transition:border-color .12s, background .12s;
  }
  .opt:hover{border-color:#AEB8CC;background:#FAFBFC;}
  .opt.selected{border-color:var(--navy-2);background:#EEF3F8;}
  .opt .letter{
    width:22px;height:22px;border-radius:50%;border:1.5px solid #C6CCD6;display:flex;align-items:center;
    justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;color:var(--ink-mute);font-family:'IBM Plex Mono';
  }
  .opt.selected .letter{background:var(--navy-2);border-color:var(--navy-2);color:#fff;}

  .submit-bar{
    position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);
    padding:16px 20px;display:flex;align-items:center;justify-content:space-between;
    margin:30px -20px -80px;box-shadow:0 -6px 18px rgba(0,0,0,0.04);
  }
  .submit-bar .note{font-size:13px;color:var(--ink-mute);}
  .submit-bar .btn{width:auto;margin:0;}

  /* ---- report screen ---- */
  .score-hero{display:flex;gap:32px;align-items:center;padding:32px;flex-wrap:wrap;}
  .gauge{position:relative;width:150px;height:150px;flex-shrink:0;}
  .gauge svg{transform:rotate(-90deg);}
  .gauge .center{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .gauge .pct{font-family:'Sora';font-weight:800;font-size:30px;}
  .gauge .of{font-size:11px;color:var(--ink-mute);margin-top:-2px;}
  .score-side h2{margin:0 0 6px;font-size:22px;}
  .badge{
    display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;
    text-transform:uppercase;letter-spacing:.04em;
  }
  .badge.pass{background:var(--green-soft);color:var(--green);}
  .badge.fail{background:var(--red-soft);color:var(--red);}
  .score-side p{color:var(--ink-mute);font-size:14px;margin:10px 0 0;max-width:420px;}

  .breakdown{padding:26px 28px;}
  .breakdown h3{margin:0 0 16px;font-size:15px;}
  .bd-row{display:flex;align-items:center;gap:14px;margin-bottom:12px;}
  .bd-row .label{width:230px;font-size:13px;color:var(--ink);flex-shrink:0;}
  .bd-track{flex:1;height:10px;background:#EEF0F3;border-radius:6px;overflow:hidden;}
  .bd-fill{height:100%;border-radius:6px;}
  .bd-score{font-family:'IBM Plex Mono';font-size:12.5px;color:var(--ink-mute);width:46px;text-align:right;}

  .review-item{padding:20px 24px;margin-bottom:12px;border-left:4px solid var(--line);}
  .review-item.correct{border-left-color:var(--green);}
  .review-item.incorrect{border-left-color:var(--red);}
  .review-item .rtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
  .review-item .rq{font-size:14.5px;font-weight:500;line-height:1.5;}
  .review-item .rmod{font-size:11px;color:var(--ink-mute);margin:4px 0 12px;font-style:italic;}
  .r-status{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;flex-shrink:0;padding:3px 9px;border-radius:12px;}
  .r-status.correct{background:var(--green-soft);color:var(--green);}
  .r-status.incorrect{background:var(--red-soft);color:var(--red);}
  .ropt{font-size:13.5px;padding:8px 12px;border-radius:7px;margin-bottom:5px;display:flex;gap:8px;}
  .ropt .l{font-family:'IBM Plex Mono';font-weight:700;font-size:12px;}
  .ropt.your-wrong{background:var(--red-soft);color:#7A2E22;}
  .ropt.correct-answer{background:var(--green-soft);color:#155C3D;}

  .section-title-row{display:flex;align-items:center;justify-content:space-between;margin:30px 0 6px;}
  .section-title-row h3{margin:0;font-size:16px;color:var(--navy);}
  .filter-chip{font-size:12px;background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:20px;cursor:pointer;color:var(--ink-mute);}
  .filter-chip.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .filter-row{display:flex;gap:8px;margin:14px 0 6px;flex-wrap:wrap;}

  /* ---- admin ---- */
  .gate-wrap{display:flex;min-height:calc(100vh - 60px);align-items:center;justify-content:center;}
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px;}
  .kpi{padding:20px;}
  .kpi .n{font-family:'Sora';font-weight:800;font-size:26px;color:var(--navy);}
  .kpi .l{font-size:12px;color:var(--ink-mute);margin-top:4px;}
  table.admin-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.admin-table th{
    text-align:left;padding:10px 14px;background:#F7F8FA;color:var(--ink-mute);
    font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;
    border-bottom:1.5px solid var(--line);
  }
  table.admin-table td{padding:12px 14px;border-bottom:1px solid var(--line);}
  table.admin-table tr.clickable{cursor:pointer;}
  table.admin-table tr.clickable:hover{background:#FAFBFD;}
  .score-pill{font-family:'IBM Plex Mono';font-weight:600;padding:2px 8px;border-radius:6px;font-size:12.5px;}
  .score-pill.pass{background:var(--green-soft);color:var(--green);}
  .score-pill.fail{background:var(--red-soft);color:var(--red);}
  .empty-state{padding:60px 20px;text-align:center;color:var(--ink-mute);}
  .empty-state .big{font-size:34px;margin-bottom:10px;}
  .weak-list{display:flex;flex-direction:column;gap:10px;}
  .weak-list .wrow{display:flex;justify-content:space-between;font-size:13.5px;padding:10px 0;border-bottom:1px solid var(--line);}
  .weak-list .wrow:last-child{border-bottom:none;}
  .back-link{font-size:13px;color:var(--navy-2);cursor:pointer;display:inline-flex;align-items:center;gap:6px;margin-bottom:16px;font-weight:600;}

  /* ---- single-question test view ---- */
  .qcounter{font-family:'IBM Plex Mono';font-size:13px;color:var(--navy);white-space:nowrap;}
  .qcounter b{color:var(--navy-2);}
  .navigator{
    display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 18px;padding:14px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
  }
  .nav-dot{
    width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono';font-size:12px;font-weight:600;color:var(--ink-mute);
    border:1.5px solid var(--line);cursor:pointer;background:#FBFBFD;flex-shrink:0;
    transition:transform .1s ease;
  }
  .nav-dot:hover{transform:scale(1.08);border-color:#AEB8CC;}
  .nav-dot.answered{background:var(--green-soft);color:var(--green);border-color:var(--green);}
  .nav-dot.current{background:var(--navy);color:#fff;border-color:var(--navy);}
  .section-tag{
    font-family:'IBM Plex Mono';font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--amber);font-weight:600;margin:0 0 8px 2px;
  }
  .qcard-single{padding:28px 30px;margin-bottom:20px;}
  .qcard-single .qtop{display:flex;gap:12px;align-items:flex-start;margin-bottom:6px;}
  .qcard-single .qnum{font-family:'IBM Plex Mono';font-weight:700;color:var(--navy-2);font-size:15px;min-width:38px;}
  .qcard-single .qtext{font-size:17px;line-height:1.6;font-weight:500;}
  .qcard-single .qmodule{font-size:12px;color:var(--ink-mute);margin:8px 0 22px 50px;font-style:italic;}
  .qcard-single .options{margin-left:50px;gap:10px;}
  .qcard-single .opt{padding:14px 16px;font-size:14.5px;}
  .nav-bar{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    margin:8px 0 40px;flex-wrap:wrap;
  }
  .nav-bar .note{font-size:12.5px;color:var(--ink-mute);flex:1;text-align:center;min-width:180px;}
  .nav-bar .btn-ghost{width:auto;}

  /* ---- test selection screen ---- */
  .test-card{padding:24px 26px;margin-bottom:14px;}
  .test-card .ttop{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;}
  .test-card h3{margin:0 0 6px;font-size:17px;}
  .test-card p{margin:0;font-size:13.5px;color:var(--ink-mute);line-height:1.55;max-width:520px;}
  .status-pill{
    font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
    padding:4px 11px;border-radius:20px;white-space:nowrap;flex-shrink:0;
  }
  .status-pill.not-started{background:#EEF0F3;color:var(--ink-mute);}
  .status-pill.in-progress{background:var(--amber-soft);color:var(--amber);}
  .status-pill.completed{background:var(--green-soft);color:var(--green);}
  .test-card .tactions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
  .test-card .tactions .btn{width:auto;margin:0;padding:9px 16px;font-size:13.5px;}
  .user-chip{
    display:flex;align-items:center;gap:8px;font-size:12.5px;color:#B9C4D6;
  }
  .user-chip .logout{cursor:pointer;text-decoration:underline;text-underline-offset:2px;color:#CBD6E8;}
  .user-chip .logout:hover{color:#fff;}

  .test-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .test-tab{
    font-size:13px;font-weight:600;padding:8px 16px;border-radius:9px;cursor:pointer;
    background:var(--card);border:1.5px solid var(--line);color:var(--ink-mute);
  }
  .test-tab.active{background:var(--navy);color:#fff;border-color:var(--navy);}

  @media (max-width:640px){
    .score-hero{flex-direction:column;text-align:center;}
    .qmodule,.options{margin-left:0;}
    .kpi-grid{grid-template-columns:repeat(2,1fr);}
    .bd-row .label{width:140px;font-size:12px;}
    .qcard-single{padding:20px;}
    .qcard-single .qmodule,.qcard-single .options{margin-left:0;}
    .nav-bar{flex-direction:column;}
    .nav-bar .note{order:3;}
    .nav-dot{width:26px;height:26px;font-size:11px;}
    .test-card .ttop{flex-direction:column;}
  }
  .search-field{margin-bottom:20px;}
  .search-field input{
    width:100%;padding:12px 16px;border:1.5px solid var(--line);border-radius:10px;
    font-size:14px;font-family:'Inter';background:#fff;
  }
  .search-field input:focus{outline:none;border-color:var(--navy-2);}
  .admin-select-wrap{margin-bottom:18px;}
  .admin-select-wrap select{
    padding:10px 14px;border:1.5px solid var(--line);border-radius:9px;font-size:14px;
    font-family:'Inter';font-weight:600;background:#fff;color:var(--navy);min-width:260px;
  }
  .loading-inline{display:flex;align-items:center;gap:10px;color:var(--ink-mute);font-size:13.5px;padding:16px 0;}
  .spinner{
    width:16px;height:16px;border:2px solid #DDE1E8;border-top-color:var(--navy-2);
    border-radius:50%;animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .gsi-btn-wrap{display:flex;justify-content:center;margin-top:8px;min-height:44px;}
  .gsi-fallback-note{font-size:12.5px;color:var(--ink-mute);text-align:center;margin-top:10px;}

  .timer-box{
    font-family:'IBM Plex Mono';font-size:14px;font-weight:600;color:var(--navy);
    padding:6px 12px;border-radius:8px;background:#EEF3F8;white-space:nowrap;
  }
  .timer-box.warn{background:var(--red-soft);color:var(--red);}
</style>
</head>
<body>
<div id="root"></div>
<script>

// ---------- Config ----------
const BACKEND_URL = "https://script.google.com/macros/s/AKfycbzeVf_4QSXQZYR8oBw5uZphTDG6BaF3Pky0OQgbj8240rHbX3TK2WiPWxg98_xmaMhP/exec";
const GOOGLE_CLIENT_ID = "690653029485-3rnbehrab4v2gqdhibqo6eqio6a5cnck.apps.googleusercontent.com";
const ALLOWED_EMAIL_DOMAIN = "meritto.com"; // hints Google's picker; the real enforcement happens server-side
const PASS_PCT = 80;
const ADMIN_CODE = "meritto2026";
const LETTERS = ["A","B","C","D"];

const state = {
  view: "login",   // login | test-select | loading-test | test | report | admin-gate | admin
  email: "",
  authChecking: false,
  authError: "",
  testCatalog: [],
  testSearchQuery: "",
  testStatuses: {},
  progressMap: {},
  questionsCache: {},

  testId: null,
  answers: {},
  currentIndex: 0,
  result: null,
  viewingPastResult: false,
  timeExpired: false,
  reviewFilter: "all",

  adminUnlocked: false,
  adminCodeInput: "",
  adminError: false,
  adminCatalog: [],
  adminTestId: null,
  submissions: [],
  adminLoading: true,
  selectedSubmissionIdx: null,
};

// ---------- Timer (module-level, not part of render state) ----------
let timerHandle = null;
let testStartedAtMs = null;
let testDurationSec = 0;

// ---------- Helpers for the currently selected test ----------
function currentQuestions(){ return state.questionsCache[state.testId] || []; }
function currentSections(){ return [...new Set(currentQuestions().map(q => q.section))]; }
function currentTotalQ(){ return currentQuestions().length; }
function currentTestMeta(){ return state.testCatalog.find(t => t.testId === state.testId); }

// ---------- Client identity (device id — email now comes from verified Google login) ----------
function getClientId(){
  let id;
  try { id = localStorage.getItem('ops_quiz_client_id'); } catch(e) { id = null; }
  if (!id){
    id = 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2,10);
    try { localStorage.setItem('ops_quiz_client_id', id); } catch(e) {}
  }
  return id;
}
const CLIENT_ID = getClientId();

function backendConfigured(){
  return BACKEND_URL && BACKEND_URL.indexOf('PASTE_YOUR') === -1;
}
function googleConfigured(){
  return GOOGLE_CLIENT_ID && GOOGLE_CLIENT_ID.indexOf('PASTE_YOUR') === -1;
}

// ---------- Backend API ----------
async function apiGet(params){
  const url = BACKEND_URL + '?' + new URLSearchParams(params).toString();
  const res = await fetch(url);
  return await res.json();
}
async function apiPost(payload){
  const res = await fetch(BACKEND_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  return await res.json();
}

async function verifyGoogleToken(idToken){
  try {
    return await apiPost({ action: 'verifyGoogleToken', idToken: idToken });
  } catch(e) { return { valid: false, reason: 'network_error' }; }
}
async function fetchTestCatalog(){
  try { const data = await apiGet({ action: 'getTestCatalog' }); return data.tests || []; }
  catch(e) { return []; }
}
async function fetchQuestionsForTest(testId){
  try { const data = await apiGet({ action: 'getQuestions', testId: testId }); return data.questions || []; }
  catch(e) { return []; }
}
async function fetchStatusForEmail(email){
  try { const data = await apiGet({ action: 'getStatusForEmail', email: email }); return data.statuses || {}; }
  catch(e) { return {}; }
}
async function fetchAllProgress(){
  try { const data = await apiGet({ action: 'getAllProgress', clientId: CLIENT_ID }); return data.progress || {}; }
  catch(e) { return {}; }
}
async function saveProgressRemote(){
  try {
    const res = await apiPost({
      action: 'saveProgress', clientId: CLIENT_ID, testId: state.testId,
      name: state.email, answers: state.answers, currentIndex: state.currentIndex,
      startedAt: testStartedAtMs ? new Date(testStartedAtMs).toISOString() : undefined
    });
    if (res && res.startedAt) testStartedAtMs = new Date(res.startedAt).getTime();
  } catch(e) {}
}
async function clearProgressRemote(testId){

}
async function submitRemote(result){

}
async function loadSubmissionsForAdmin(testId){

}

async function ensureQuestionsLoaded(testId){

// ---------- Timer ----------
function startTimerFor(testId, startedAtIso){
  stopTimer();
  const meta = state.testCatalog.find(t => t.testId === testId);
  testDurationSec = meta && meta.durationMinutes ? meta.durationMinutes * 60 : 0;
  testStartedAtMs = startedAtIso ? new Date(startedAtIso).getTime() : Date.now();
  if (testDurationSec <= 0) return; // no time limit configured
  timerHandle = setInterval(updateTimerTick, 1000);
  updateTimerTick();
}
function stopTimer(){
  if (timerHandle){ clearInterval(timerHandle); timerHandle = null; }
}
function updateTimerTick(){
  const el = document.getElementById('timer-display');
  if (!el){ return; }
  const elapsed = Math.floor((Date.now() - testStartedAtMs) / 1000);
  const remaining = testDurationSec - elapsed;
  if (remaining <= 0){
    el.textContent = "0:00";
    stopTimer();
    forceSubmitOnTimeout();
    return;
  }
  const m = Math.floor(remaining / 60);
  const s = remaining % 60;
  el.textContent = m + ":" + String(s).padStart(2,'0');
  el.parentElement.classList.toggle('warn', remaining <= 120);
}
async function forceSubmitOnTimeout(){
  state.timeExpired = true;
  await submitTest();
}

// ---------- Scoring ----------
function computeResult(answers){
  const questions = currentQuestions();
  const sections = currentSections();
  let correctCount = 0;
  const perQuestion = [];
  const sectionMap = {};
  sections.forEach(s => sectionMap[s] = {correct:0, total:0});

  questions.forEach(q => {
    const chosen = answers[q.id];
    const isCorrect = chosen === q.correct;
    if (isCorrect) correctCount++;
    sectionMap[q.section].total++;
    if (isCorrect) sectionMap[q.section].correct++;
    perQuestion.push({
      id: q.id, section: q.section, module: q.module, question: q.question,
      options: q.options, correctIndex: q.correct, chosenIndex: chosen, isCorrect
    });
  });

  const total = questions.length;
  const pct = total > 0 ? Math.round((correctCount/total)*100) : 0;
  return {
    correctCount, total, pct,
    pass: pct >= PASS_PCT,
    sectionScores: sections.map(s => ({ section: s, ...sectionMap[s], pct: Math.round((sectionMap[s].correct/sectionMap[s].total)*100) })),
    perQuestion,
    timestamp: new Date().toISOString()
  };
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}) + ' ' + d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
}
function scoreColor(pct){
  if (pct >= PASS_PCT) return 'var(--green)';
  if (pct >= 60) return 'var(--amber)';
  return 'var(--red)';
}

function testCardStatus(testId){
  const sub = state.testStatuses[testId];
  const prog = state.progressMap[testId];
  if (sub) return { kind: 'completed', sub };
  if (prog && prog.answers && Object.keys(prog.answers).length > 0) return { kind: 'in-progress', prog };
  return { kind: 'not-started' };
}

function renderTestSelect(){
  const query = state.testSearchQuery.trim().toLowerCase();
  const filtered = state.testCatalog.filter(t =>
    !query || t.name.toLowerCase().includes(query) || (t.description||'').toLowerCase().includes(query)
  );

  const cards = filtered.map(test => {
    const testId = test.testId;
    const st = testCardStatus(testId);
    const total = test.questionCount;

    let pill, actions;
    if (st.kind === 'completed'){
      pill = `<span class="status-pill completed">Completed — ${st.sub.result.pct}%</span>`;
      actions = `
        <button class="btn btn-primary" onclick="viewPastResult('${testId}')">View my result</button>

        <button class="btn btn-primary" onclick="resumeTest('${testId}')">Resume</button>

function renderNavigator(){
  const questions = currentQuestions();
  let dots = "";
  questions.forEach((q, i) => {
    const answered = state.answers[q.id] !== undefined;
    const isCurrent = i === state.currentIndex;
    let cls = "nav-dot";
    if (isCurrent) cls += " current";
    else if (answered) cls += " answered";
    dots += `<div class="${cls}" onclick="jumpToQuestion(${i})" title="Question ${i+1}${answered?' — answered':''}">${i+1}</div>`;
  });
  return `<div class="navigator">${dots}</div>`;
}

function renderTest(){
  const questions = currentQuestions();
  const totalQ = questions.length;
  const q = questions[state.currentIndex];
  const chosen = state.answers[q.id];
  const answeredCount = Object.keys(state.answers).length;
  const isLast = state.currentIndex === totalQ - 1;
  const isFirst = state.currentIndex === 0;

  let optsHtml = "";
  q.options.forEach((opt, i) => {
    optsHtml += `

          <div class="progress-count">${answeredCount} / ${totalQ} answered</div>

// ---------- Report ----------
function renderGauge(pct){
  const r = 62, c = 2*Math.PI*r;
  const off = c - (pct/100)*c;
  const col = scoreColor(pct);
  return `
    <div class="gauge">
      <svg width="150" height="150" viewBox="0 0 150 150">
        <circle cx="75" cy="75" r="${r}" fill="none" stroke="#EEF0F3" stroke-width="12"/>
        <circle cx="75" cy="75" r="${r}" fill="none" stroke="${col}" stroke-width="12"
          stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"/>
      </svg>
      <div class="center">
        <div class="pct" style="color:${col}">${pct}%</div>
        <div class="of">score</div>
      </div>
    </div>`;
}

function renderBreakdown(sectionScores){
  let rows = "";
  sectionScores.forEach(s => {
    const col = scoreColor(s.pct);
    rows += `
      <div class="bd-row">
        <div class="label">${escapeHtml(s.section)}</div>
        <div class="bd-track"><div class="bd-fill" style="width:${s.pct}%;background:${col}"></div></div>
        <div class="bd-score">${s.correct}/${s.total}</div>
      </div>`;
  });
  return `<div class="card breakdown"><h3>Performance by section</h3>${rows}</div>`;
}

function renderReviewList(perQuestion, filter){
  const filtered = perQuestion.filter(q => filter==='all' ? true : (filter==='incorrect' ? !q.isCorrect : q.isCorrect));
  if (filtered.length === 0){
    return `<div class="empty-state"><div class="big">✓</div>Nothing to show for this filter.</div>`;
  }
  return filtered.map(q => {
    const yourOpt = q.chosenIndex;
    return `
      <div class="review-item card ${q.isCorrect?'correct':'incorrect'}">
        <div class="rtop">
          <div>
            <div class="rq">Q${q.id}. ${escapeHtml(q.question)}</div>
            <div class="rmod">Related Module: ${escapeHtml(q.module)}</div>
          </div>
          <div class="r-status ${q.isCorrect?'correct':'incorrect'}">${q.isCorrect?'Correct':'Incorrect'}</div>
        </div>
        ${!q.isCorrect && yourOpt !== undefined ? `<div class="ropt your-wrong"><span class="l">${LETTERS[yourOpt]}</span> ${escapeHtml(q.options[yourOpt])} — your answer</div>` : ''}
        <div class="ropt correct-answer"><span class="l">${LETTERS[q.correctIndex]}</span> ${escapeHtml(q.options[q.correctIndex])} — correct answer</div>
      </div>`;
  }).join("");
}

  const selectOptions = state.adminCatalog.map(t =>

  ).join("");

  if (state.adminLoading){

  }

  if (state.selectedSubmissionIdx !== null){
    const sub = state.submissions[state.selectedSubmissionIdx];
    return `${renderTopbar('login')}<div class="app wide">${renderAdminDetail(sub)}</div>`;
  }

  const avgPct = Math.round(subs.reduce((a,s)=>a+s.result.pct,0)/subs.length);
  const passCount = subs.filter(s=>s.result.pass).length;
  const passRate = Math.round((passCount/subs.length)*100);

  const secAgg = {};
  subs.forEach(s => s.result.sectionScores.forEach(ss => {
    if (!secAgg[ss.section]) secAgg[ss.section] = {correct:0,total:0};
    secAgg[ss.section].correct += ss.correct;
    secAgg[ss.section].total += ss.total;
  }));
  const weakSections = Object.keys(secAgg).map(s => ({
    section: s, pct: Math.round((secAgg[s].correct/secAgg[s].total)*100)
  })).sort((a,b)=>a.pct-b.pct);

  const rows = subs.slice().sort((a,b)=> new Date(b.timestamp)-new Date(a.timestamp)).map((s) => {
    const realIdx = subs.indexOf(s);
    return `

        <td>${s.result.pass ? 'Passed' : 'Needs review'}</td>
      </tr>`;
  }).join("");

  const weakHtml = weakSections.slice(0,5).map(w => `
    <div class="wrow">
      <span>${escapeHtml(w.section)}</span>
      <span class="mono" style="color:${scoreColor(w.pct)};font-weight:600;">${w.pct}%</span>
    </div>`).join("");

  return `
    ${renderTopbar('login')}
    <div class="app wide">
      ${selector}
      <h2 style="margin-bottom:4px;">${escapeHtml(testMeta ? testMeta.name : state.adminTestId)} — Team Performance</h2>
      <p style="color:var(--ink-mute);font-size:13.5px;margin-top:0;">${subs.length} submission${subs.length!==1?'s':''} recorded</p>

      <div class="kpi-grid">
        <div class="card kpi"><div class="n">${subs.length}</div><div class="l">Team members tested</div></div>
        <div class="card kpi"><div class="n">${avgPct}%</div><div class="l">Average score</div></div>
        <div class="card kpi"><div class="n">${passRate}%</div><div class="l">Pass rate (≥${PASS_PCT}%)</div></div>
        <div class="card kpi"><div class="n">${passCount}/${subs.length}</div><div class="l">Passed the assessment</div></div>
      </div>

      <div class="card pad" style="margin-bottom:24px;">
        <h3 style="margin:0 0 14px;font-size:15px;">Lowest-scoring sections across the team</h3>
        <div class="weak-list">${weakHtml}</div>
      </div>

      <div class="card" style="overflow:hidden;">
        <table class="admin-table">
          <thead><tr><th>Email</th><th>Submitted</th><th>Score</th><th>%</th><th>Result</th></tr></thead>

  state.authChecking = true;
  state.authError = "";
  render();

  const result = await verifyGoogleToken(response.credential);
  if (!result.valid){
    state.authChecking = false;
    state.authError = result.reason === "domain_not_allowed"
      ? "Please sign in with your @meritto.com Google account."
      : "Could not verify your Google sign-in. Please try again.";
    render();
    return;
  }

  state.email = result.email;
  const [catalog, statuses, progress] = await Promise.all([
    fetchTestCatalog(),
    fetchStatusForEmail(state.email),
    fetchAllProgress()
  ]);
  state.testCatalog = catalog;
  state.testStatuses = statuses;
  state.progressMap = progress;
  state.authChecking = false;
  state.view = "test-select";
  render();
}

function logout(){
  try { if (typeof google !== 'undefined' && google.accounts) google.accounts.id.disableAutoSelect(); } catch(e) {}
  state.email = "";
  state.testCatalog = [];
  state.testStatuses = {};
  state.progressMap = {};
  state.questionsCache = {};
  state.testId = null;
  state.testSearchQuery = "";
  state.authError = "";
  state.view = "login";
  render();
}

function setTestSearch(val){
  state.testSearchQuery = val;
  render();
}

function exitToTestSelect(){
  stopTimer();
  state.view = "test-select";
  state.answers = {};
  state.result = null;
  state.currentIndex = 0;
  state.testId = null;
  state.timeExpired = false;
  render();
  refreshTestSelectData();
}

async function refreshTestSelectData(){
  const [catalog, statuses, progress] = await Promise.all([
    fetchTestCatalog(),
    fetchStatusForEmail(state.email),
    fetchAllProgress()
  ]);
  state.testCatalog = catalog;
  state.testStatuses = statuses;
  state.progressMap = progress;
  render();
}

async function beginTest(testId){
  state.testId = testId;
  state.view = "loading-test";
  render();
  await ensureQuestionsLoaded(testId);
  state.answers = {};
  state.currentIndex = 0;
  state.viewingPastResult = false;
  state.timeExpired = false;
  state.view = "test";
  render();
  window.scrollTo(0,0);
  startTimerFor(testId, null);
  saveProgressRemote();
}

async function resumeTest(testId){
  state.testId = testId;
  state.view = "loading-test";
  render();
  await ensureQuestionsLoaded(testId);
  const prog = state.progressMap[testId];
  state.answers = (prog && prog.answers) || {};
  state.currentIndex = Math.min((prog && prog.currentIndex) || 0, currentTotalQ() - 1);
  state.viewingPastResult = false;
  state.timeExpired = false;
  state.view = "test";
  render();
  window.scrollTo(0,0);
  startTimerFor(testId, prog && prog.startedAt ? prog.startedAt : null);
}

async function retakeTest(testId){
  await clearProgressRemote(testId);
  delete state.progressMap[testId];
  beginTest(testId);
}

function viewPastResult(testId){
  stopTimer();
  const sub = state.testStatuses[testId];
  state.testId = testId;
  state.result = sub.result;
  state.viewingPastResult = true;
  state.reviewFilter = "all";
  state.view = "report";
  render();
  window.scrollTo(0,0);
}

// ---------- Test taking ----------
function selectOption(qid, idx){
  state.answers[qid] = idx;
  render();
  saveProgressRemote();
}

function goNext(){
  if (state.currentIndex < currentTotalQ() - 1){
    state.currentIndex++;
    render();
    window.scrollTo(0,0);
    saveProgressRemote();
  }
}
function goPrev(){
  if (state.currentIndex > 0){
    state.currentIndex--;
    render();
    window.scrollTo(0,0);
    saveProgressRemote();
  }
}
function jumpToQuestion(idx){
  state.currentIndex = idx;
  render();
  window.scrollTo(0,0);
  saveProgressRemote();
}

function attemptSubmit(){
  const questions = currentQuestions();
  const answeredCount = Object.keys(state.answers).length;
  if (answeredCount < questions.length){
    const firstUnanswered = questions.findIndex(q => state.answers[q.id] === undefined);
    if (!confirm(`You still have ${questions.length - answeredCount} unanswered question(s). Go to the first unanswered question?`)) return;
    state.currentIndex = firstUnanswered;
    render();
    window.scrollTo(0,0);
    return;
  }
  submitTest();
}

async function submitTest(){
  stopTimer();
  const result = computeResult(state.answers);
  state.result = result;
  state.viewingPastResult = false;
  state.view = "report";
  render();
  window.scrollTo(0,0);
  try {
    await submitRemote(result);
    state.testStatuses[state.testId] = { timestamp: result.timestamp, email: state.email, testId: state.testId, result: result };
  } catch(e) { /* still show the report even if save fails */ }
}

function setReviewFilter(f){
  state.reviewFilter = f;
  render();
}

// ---------- Admin ----------
async function goAdmin(){
  state.view = state.adminUnlocked ? "admin" : "admin-gate";
  state.selectedSubmissionIdx = null;
  render();
  if (state.adminUnlocked) {
    if (state.adminCatalog.length === 0){
      state.adminCatalog = await fetchTestCatalog();
      state.adminTestId = state.adminCatalog.length ? state.adminCatalog[0].testId : null;
    }
    loadAdminData();
  }
}

async function checkAdminCode(){
  if (state.adminCodeInput === ADMIN_CODE){
    state.adminUnlocked = true;
    state.adminError = false;
    state.view = "admin";
    render();
    state.adminCatalog = await fetchTestCatalog();
    state.adminTestId = state.adminCatalog.length ? state.adminCatalog[0].testId : null;
    loadAdminData();
  } else {
    state.adminError = true;
    render();
  }
}

function switchAdminTest(testId){
  state.adminTestId = testId;
  state.selectedSubmissionIdx = null;
  loadAdminData();
}

async function loadAdminData(){
  if (!state.adminTestId){ state.adminLoading = false; render(); return; }
  state.adminLoading = true;
  render();
  const subs = await loadSubmissionsForAdmin(state.adminTestId);
  state.submissions = subs;
  state.adminLoading = false;
  render();
}

// ---------- Init ----------
if (!backendConfigured()){
  state.view = "config-missing";
  render();
} else {
  render();
}
</script>
</body>
</html>
